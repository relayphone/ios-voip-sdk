name: SDKM3SettingsProbe
options:
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SettingsProbeHost:
    type: application
    platform: iOS
    sources: [Host.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iosvoipsdk.m3settingshost
  SettingsProbe:
    type: bundle.ui-testing
    platform: iOS
    sources: [DefaultCallingTests.swift]
    dependencies:
      - target: SettingsProbeHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iosvoipsdk.m3settingsprobe
        TEST_TARGET_NAME: SettingsProbeHost
schemes:
  SDKM3SettingsProbe:
    build:
      targets:
        SettingsProbeHost: all
        SettingsProbe: [test]
    test:
      targets: [SettingsProbe]
      gatherCoverageData: false
