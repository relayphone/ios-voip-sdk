name: CallKitDeviceProbe
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: 85A9MS6428
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Probe:
    type: application
    platform: iOS
    sources: [../probe/main.swift]
    settings:
      base:
        PRODUCT_NAME: Probe
        PRODUCT_BUNDLE_IDENTIFIER: dev.callkitsim.probe
        INFOPLIST_FILE: ../probe/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Probe.entitlements
        OTHER_SWIFT_FLAGS: "-parse-as-library -D CKSIM_HAS_VOIP_METADATA"
