name: AudioLifecycleDeviceProbe
options:
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  AudioLifecycleDeviceProbe:
    type: application
    platform: iOS
    sources: [probe, core/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iosvoipsdk.audio-lifecycle-probe
        INFOPLIST_FILE: probe/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: probe/Probe-Bridging.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/probe", "$(SRCROOT)/core/Sources/VoIPPlatform/include"]
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_SWIFT_FLAGS: "-parse-as-library"
