name: MediaProbe
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 154.0.0
settings:
  base:
    DEVELOPMENT_TEAM: 85A9MS6428
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  MediaProbe:
    type: application
    platform: iOS
    sources: [MediaProbe.swift]
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio, voip]
        NSMicrophoneUsageDescription: Media probe measures call audio.
        UILaunchScreen: {}
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.callkitsim.mediaprobe
        GENERATE_INFOPLIST_FILE: NO
        OTHER_SWIFT_FLAGS: "-parse-as-library"
