buildscript {
  repositories { mavenCentral(); gradlePluginPortal() }
  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-serialization:${rootProject.ext.kotlinVersion}"
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

expoModule { canBePublished false }

def checkout = file('../../android/core/src/main').isDirectory()
def sdk = checkout ? file('../../android') : file('Vendor')
def schemas = checkout ? file('../../spec') : file('Vendor/spec')
def wireSchemas = tasks.register('copyBridgeSchemas', Copy) {
  from(schemas) { include 'bridge.schema.json', 'model.schema.json', 'v1/model.schema.json' }
  into layout.buildDirectory.dir('generated/bridgeResources/voip')
}

android {
  namespace 'com.relayphone.voip.system'
  defaultConfig { minSdk 26 }
  sourceSets.main {
    java.srcDir 'src/bridge/kotlin'
    java.srcDirs += ['core', 'runtime', 'system'].collect { new File(sdk, "${it}/src/main/kotlin") }
    res.srcDirs += new File(sdk, 'system/src/main/res')
    resources.srcDirs += wireSchemas.map { it.destinationDir.parentFile }
  }
}

tasks.named('preBuild').configure { dependsOn wireSchemas }
kotlin.compilerOptions.optIn.add('kotlin.time.ExperimentalTime')

dependencies {
  api 'com.google.firebase:firebase-messaging:25.0.1'
  implementation 'androidx.core:core-telecom:1.1.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
}
