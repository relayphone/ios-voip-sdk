name: Upload an SDK artifact
description: Upload one producer's transfer or evidence with one visible transport retry.
inputs:
  name:
    description: Unique producer role and workflow run ID.
    required: true
  path:
    description: Already validated producer files.
    required: true
  retention-days:
    description: Short lifetime for this artifact.
    default: '1'
  if-no-files-found:
    description: Preserve the caller's missing-evidence policy.
    default: error
  compression-level:
    description: Transfers are already packed; diagnostic logs use compression.
    default: '0'
runs:
  using: composite
  steps:
    - id: first
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        compression-level: ${{ inputs.compression-level }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
    - id: retry
      if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        compression-level: ${{ inputs.compression-level }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
    - name: Require transfer completion and classify recovery
      if: ${{ always() && !cancelled() }}
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        TRANSFER_FIRST: ${{ steps.first.outcome }}
        TRANSFER_RETRY: ${{ steps.retry.outcome }}
      run: >-
        "$ACTION_ROOT/../../../scripts/ci/bounded" 30
        python3 "$ACTION_ROOT/../../../scripts/ci/artifact_transfer_status.py"
