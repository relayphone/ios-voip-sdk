name: Cache native dependencies
description: Cache React Native, Hermes and CocoaPods downloads for the pinned versions
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: node Tools/native-dependency-versions.ts
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/Library/Caches/ReactNative
          ~/Library/Caches/CocoaPods
        key: native-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-rn-${{ steps.versions.outputs.rn }}-hermes-${{ steps.versions.outputs.hermes }}-${{ hashFiles('package-lock.json') }}
