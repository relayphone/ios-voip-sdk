name: JavaScript simulator journeys

on:
  pull_request:
    paths: &paths
      - 'expo/**'
      - 'Sources/VoIP*/**'
      - 'Sources/CKSim*/**'
      - 'Sources/cksim/**'
      - 'Sources/Engine/**'
      - 'Sources/Interposition/**'
      - 'tools/expo-*'
      - 'tools/build-runtime.ts'
      - 'tools/runtime-package.ts'
      - 'tools/runtime-smoke.ts'
      - 'tools/command.ts'
      - 'tools/simulator-app.ts'
      - 'tools/inspector-devices.ts'
      - 'tools/inspector-resources.ts'
      - 'tools/inspector-processes.ts'
      - 'VERSION'
      - '.github/actions/setup/**'
      - '.github/workflows/expo-journeys.yml'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-journeys-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  journeys:
    name: JavaScript journeys on one simulator
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the control tool and pack the module
        run: |
          trap 'if [[ $? != 0 ]]; then echo "product:build failed" >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
          node tools/build-runtime.ts "$RUNNER_TEMP/expo-journey/runtime" --archs "$(uname -m)"
          npm ci --prefix expo --ignore-scripts --no-audit --no-fund
          npm pack ./expo --pack-destination "$RUNNER_TEMP"
      - name: Install the packed module and build a bundled Debug example
        run: |
          trap 'if [[ $? != 0 ]]; then echo "product:build failed" >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
          cp -R expo/example/client "$RUNNER_TEMP/expo-journey/example"
          cd "$RUNNER_TEMP/expo-journey/example"
          npm install --no-audit --no-fund "$RUNNER_TEMP/"*.tgz
          npm run typecheck
          npm run prebuild -- --no-install
          cd ios
          pod install --repo-update
          node "$GITHUB_WORKSPACE/tools/expo-journey-bundle.ts" "$PWD"
          cd ..
          xcodebuild -workspace ios/VoIPExample.xcworkspace -scheme VoIPExample \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/expo-journey/build" CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO build > "$RUNNER_TEMP/expo-journey/build.log" 2>&1 || {
              tail -100 "$RUNNER_TEMP/expo-journey/build.log"; exit 1;
            }
          test -s "$RUNNER_TEMP/expo-journey/build/Build/Products/Debug-iphonesimulator/VoIPExample.app/main.jsbundle"
      - name: Drive JavaScript and verify app results and the runtime journal
        run: |
          node tools/expo-journey.ts "$RUNNER_TEMP/expo-journey" \
            "$RUNNER_TEMP/expo-journey/build/Build/Products/Debug-iphonesimulator/VoIPExample.app"
      - name: Delete every created simulator and temporary build
        if: always()
        run: |
          status=0
          for marker in "$RUNNER_TEMP/expo-journey/simulators/"*; do
            [[ -f "$marker" ]] || continue
            name="${marker##*/}"
            xcrun simctl shutdown "$name" || true
            if xcrun simctl delete "$name"; then rm "$marker"; else status=1; fi
          done
          rm -rf "$RUNNER_TEMP/expo-journey/build" "$RUNNER_TEMP/expo-journey/example" "$RUNNER_TEMP/expo-journey/runtime"
          if [[ "$status" != 0 ]]; then echo "infra:cleanup failed" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - name: Keep app results, journals and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expo-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/expo-journey/results
            ${{ runner.temp }}/expo-journey/build.log
          if-no-files-found: ignore
          retention-days: 7
