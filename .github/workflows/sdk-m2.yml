name: SDK M2 selected LiveKit simulator acceptance

on:
  push:
    branches: [main]
    paths:
      - "Package.swift"
      - "VERSION"
      - "Sources/**"
      - "Expo/**"
      - "ExpoMedia/**"
      - "Integrations/**"
      - "Tests/**"
      - "Tools/cksim-notify.c"
      - "example/**"
      - "package*.json"
      - "tsconfig.json"
      - "expo-module.config.json"
      - "IosVoipSDK.podspec"
      - "discovery/**"
      - "docs/research/callkit-simulator-probe/audio-session-lifecycle/**"
      - ".github/workflows/sdk-m2.yml"
  pull_request:
    paths:
      - "Package.swift"
      - "VERSION"
      - "Sources/**"
      - "Expo/**"
      - "ExpoMedia/**"
      - "Integrations/**"
      - "Tests/**"
      - "Tools/cksim-notify.c"
      - "example/**"
      - "package*.json"
      - "tsconfig.json"
      - "expo-module.config.json"
      - "IosVoipSDK.podspec"
      - "discovery/**"
      - "docs/research/callkit-simulator-probe/audio-session-lifecycle/**"
      - ".github/workflows/sdk-m2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-m2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selected-livekit:
    name: Selected LiveKit (${{ matrix.audio-path }}, ${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: "26.6"
            xcode-build: ""
            runtime: "iOS 26.5"
            audio-path: legacy
            artifact: sdk-m2-macos-26-xcode-26.6
          - runner: xcode-27
            xcode: "27.1"
            xcode-build: "27A9275"
            runtime: "iOS 27.0"
            audio-path: modern
            artifact: sdk-m2-xcode-27-xcode-27.1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      SDK_EXAMPLE_MEDIA_ADAPTER: livekit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set runner-local capture paths
        run: |
          {
            printf 'SDK_M2_BUILD_ROOT=%s\n' "$RUNNER_TEMP/sdk-m2-build"
            printf 'SDK_M2_CAPTURE=%s\n' "$RUNNER_TEMP/sdk-m2"
          } >> "$GITHUB_ENV"
      - name: Select Xcode ${{ matrix.xcode }} (CI qualification host)
        run: sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
      - name: Record and verify the assigned host and requested runtime
        env:
          M2_XCODE_BUILD: ${{ matrix.xcode-build }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$M2_XCODE_BUILD" ]]; then args+=(--xcode-build "$M2_XCODE_BUILD"); fi
          python3 discovery/sdk_m2_environment.py \
            --runtime '${{ matrix.runtime }}' --audio-path '${{ matrix.audio-path }}' \
            --xcode-version '${{ matrix.xcode }}' "${args[@]}" \
            --output "$RUNNER_TEMP/sdk-m2-environment-preflight.json"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Check M2 evidence controls and selected adapter configuration
        run: |
          set -euo pipefail
          python3 discovery/check_sdk_m2.py
          python3 discovery/check_sdk_m2_environment.py
          python3 discovery/check_sdk_m2_audio_lifecycle.py
          python3 discovery/check_sdk_audio_device_transport.py
          python3 discovery/check_sdk_audio_device_noio_transport.py
          python3 Tests/AudioLifecycle/check_audio_lifecycle.py
          python3 discovery/check_expo_media.py
          python3 discovery/check_expo_media_config.py
          bash Tests/AudioCore/run_livekit.sh
          bash -n discovery/build_sdk_m2.sh
          python3 -m py_compile discovery/run_sdk_m2.py
      - name: Install and check the pinned JavaScript workspace
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run typecheck
          node --test Expo/tests/m1-runtime.test.cjs
      - name: Generate the selected LiveKit iOS example
        run: |
          set -euo pipefail
          npm exec --workspace ios-voip-sdk-example -- expo prebuild --platform ios --no-install
          cd example/ios
          pod install
      - name: Build source-bound Release example and Debug media contract
        run: |
          set -euo pipefail
          bash discovery/build_sdk_m2.sh "$SDK_M2_BUILD_ROOT"
          cp "$RUNNER_TEMP/sdk-m2-environment-preflight.json" "$SDK_M2_BUILD_ROOT/environment-preflight.json"
      - name: Measure LiveKit, watchdog, media reentrancy and audio lifecycle on one owned simulator
        run: >-
          python3 discovery/run_sdk_m2.py --build-root "$SDK_M2_BUILD_ROOT" --output "$SDK_M2_CAPTURE"
          --runtime '${{ matrix.runtime }}' --audio-path '${{ matrix.audio-path }}'
      - name: Preserve M2 receipts, products and native build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/sdk-m2
            ${{ runner.temp }}/sdk-m2-environment-preflight.json
            ${{ runner.temp }}/sdk-m2-build/*.json
            ${{ runner.temp }}/sdk-m2-build/*.log
            ${{ runner.temp }}/sdk-m2-build/binaries
            ${{ runner.temp }}/sdk-m2-build/products
            ${{ runner.temp }}/sdk-m2-build/contracts/*.json
            ${{ runner.temp }}/sdk-m2-build/contracts/*.log
          if-no-files-found: error
          retention-days: 14
