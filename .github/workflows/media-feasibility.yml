name: Media hook feasibility
on:
  pull_request:
    paths: ['MediaTesting/**', 'tools/media-test/**', 'expo/example/client/**', 'expo/ios/**', 'Package.*', '.github/workflows/media-feasibility.yml', '.github/actions/setup*/**', 'tools/simulator-runtime.ts']
permissions:
  contents: read
concurrency:
  group: media-feasibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
        with:
          xcode: "false"
      - run: npm ci --prefix tools/media-test --no-audit --no-fund
      - run: node --test tools/media-test/*.test.ts
  duplex:
    needs: host-harness
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-simulator
      - name: Test the example command protocol
        run: |
          perl -e 'alarm 120; exec @ARGV' swift test --package-path expo/example/client/modules/media-feasibility \
            --scratch-path "$RUNNER_TEMP/media-journey-protocol" --jobs 2 > "$RUNNER_TEMP/media-journey-protocol.log" 2>&1
      - name: Resolve the optional media package
        run: node tools/check-package-isolation.ts media
      - name: Compile excluded configurations without LiveKit
        run: |
          xcrun --sdk iphoneos swiftc -DDEBUG -target arm64-apple-ios26.0 -parse-as-library \
            -emit-module -module-name VoIPMediaTesting -emit-module-path "$RUNNER_TEMP/excluded-device.swiftmodule" MediaTesting/Sources/VoIPMediaTesting/*.swift
          xcrun --sdk iphonesimulator swiftc -target arm64-apple-ios26.0-simulator -parse-as-library \
            -emit-module -module-name VoIPMediaTesting -emit-module-path "$RUNNER_TEMP/excluded-release.swiftmodule" MediaTesting/Sources/VoIPMediaTesting/*.swift
      - name: Prepare the example and resolve CocoaPods
        run: |
          npm ci --prefix expo --ignore-scripts --no-audit --no-fund
          npm run build --prefix expo
          npm run sync:sources --prefix expo
          cd expo/example/client
          npm install --no-audit --no-fund
          npm run prebuild -- --no-install
          cd ios
          perl -e 'alarm 300; exec @ARGV' pod install
          node "$GITHUB_WORKSPACE/tools/expo-journey-bundle.ts" "$PWD"
      - name: Set the daily package cache scope
        id: package-cache-scope
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # Limit reuse to one day; GitHub evicts caches after seven inactive days.
      - name: Restore SwiftPM checkouts and binary artifacts
        id: packages
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/media-source-packages
            ${{ runner.temp }}/media-example-source-packages
          key: media-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-xcode27.1-${{ steps.package-cache-scope.outputs.day }}-${{ hashFiles('MediaTesting/Package.resolved', 'expo/package-lock.json', 'expo/example/client/package-lock.json', 'expo/example/client/ios/Podfile.lock') }}
      - name: Resolve optional Swift package dependencies
        working-directory: MediaTesting
        run: |
          /usr/bin/time -p perl -e 'alarm 300; exec @ARGV' xcodebuild -resolvePackageDependencies -scheme VoIPMediaTesting \
            -derivedDataPath "$RUNNER_TEMP/media-package" -clonedSourcePackagesDirPath "$RUNNER_TEMP/media-source-packages" \
            -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates > "$RUNNER_TEMP/media-package-resolution.log" 2>&1
      - name: Resolve example Swift package dependencies
        working-directory: expo/example/client/ios
        run: |
          /usr/bin/time -p perl -e 'alarm 300; exec @ARGV' xcodebuild -resolvePackageDependencies -workspace VoIPExample.xcworkspace -scheme VoIPExample \
            -derivedDataPath "$RUNNER_TEMP/media-build" -clonedSourcePackagesDirPath "$RUNNER_TEMP/media-example-source-packages" \
            -skipPackageUpdates > "$RUNNER_TEMP/media-example-resolution.log" 2>&1
      - name: Save resolved SwiftPM checkouts and binary artifacts
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/media-source-packages
            ${{ runner.temp }}/media-example-source-packages
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Build the bundled native-media example
        working-directory: expo/example/client/ios
        run: |
          node "$GITHUB_WORKSPACE/tools/media-test/build-timeout.ts" 900 "$RUNNER_TEMP/media-build-diagnostics/example" \
            xcodebuild -showBuildTimingSummary -workspace VoIPExample.xcworkspace -scheme VoIPExample -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/media-build" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/media-example-source-packages" -disableAutomaticPackageResolution -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build > "$RUNNER_TEMP/build.log" 2>&1
      - name: Prepare the pinned peer and local server
        run: |
          npm ci --prefix tools/media-test --no-audit --no-fund
          node expo/node_modules/typescript/bin/tsc --noEmit --strict --target es2024 --module nodenext \
            --moduleResolution nodenext --types node --typeRoots ./expo/node_modules/@types \
            --skipLibCheck --allowImportingTsExtensions tools/media-test/*.ts
      - name: Check the independent video peer
        run: VIDEO_PEER_INTEGRATION=1 node --test tools/media-test/video-peer.integration.test.ts
      - name: Boot the media test simulator
        run: |
          id=$(perl -e 'alarm 120; exec @ARGV' xcrun simctl create media-feasibility com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-2)
          echo "$id" > "$RUNNER_TEMP/media-simulator"
          perl -e 'alarm 120; exec @ARGV' xcrun simctl boot "$id"
          perl -e 'alarm 300; exec @ARGV' xcrun simctl bootstatus "$id" -b
      - name: Build native package tests
        run: |
          id=$(cat "$RUNNER_TEMP/media-simulator")
          (cd MediaTesting && /usr/bin/time -p node "$GITHUB_WORKSPACE/tools/media-test/build-timeout.ts" \
            900 "$RUNNER_TEMP/media-build-diagnostics/native-tests" xcodebuild -showBuildTimingSummary build-for-testing \
            -scheme VoIPMediaTesting -destination "platform=iOS Simulator,id=$id" \
            -derivedDataPath "$RUNNER_TEMP/media-package" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/media-source-packages" -disableAutomaticPackageResolution -skipPackageUpdates \
            -only-testing:VoIPMediaTestingTests \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO > "$RUNNER_TEMP/media-package-build.log" 2>&1)
      - name: Run the built native package tests
        working-directory: ${{ runner.temp }}
        run: |
          id=$(cat "$RUNNER_TEMP/media-simulator")
          shopt -s nullglob
          test_runs=("$RUNNER_TEMP/media-package/Build/Products/"*.xctestrun)
          if [ "${#test_runs[@]}" -ne 1 ]; then
            echo "Expected one native test run specification, found ${#test_runs[@]}" >&2
            exit 1
          fi
          xcrun --sdk iphonesimulator swiftc -swift-version 6 -target arm64-apple-ios26.0-simulator \
            "$GITHUB_WORKSPACE/tools/media-test/SimulatorTestHost.swift" -o "$RUNNER_TEMP/native-test-host"
          /usr/bin/time -p node "$GITHUB_WORKSPACE/tools/media-test/run-native-tests.ts" 300 \
            "$RUNNER_TEMP/media-build-diagnostics/native-tests-run" "$id" "${test_runs[0]}" \
            "$RUNNER_TEMP/native-test-host" > "$RUNNER_TEMP/media-package-tests.log" 2>&1
          NATIVE_LAUNCHER_SPEC="${test_runs[0]}" NATIVE_LAUNCHER_SIMULATOR="$id" \
            NATIVE_LAUNCHER_HOST="$RUNNER_TEMP/native-test-host" \
            NATIVE_LAUNCHER_DIRECTORY="$RUNNER_TEMP/media-build-diagnostics/launcher-controls" \
            node --test "$GITHUB_WORKSPACE/tools/media-test/native-test-launcher.integration.test.ts"
      - name: Check media hooks and continuous silence windows
        run: |
          id=$(cat "$RUNNER_TEMP/media-simulator")
          perl -e 'alarm 300; exec @ARGV' node tools/media-test/feasibility.ts "$id" \
            "$RUNNER_TEMP/media-build/Build/Products/Debug-iphonesimulator/VoIPExample.app" \
            "$RUNNER_TEMP/media-result-synthetic.json"
      - name: Upload build timeout diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: media-build-timeout-diagnostics
          path: ${{ runner.temp }}/media-build-diagnostics
          if-no-files-found: ignore
          retention-days: 3
      - name: Clean up
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/media-simulator" ]; then
            id=$(cat "$RUNNER_TEMP/media-simulator")
            perl -e 'alarm 120; exec @ARGV' xcrun simctl shutdown "$id" || true
            perl -e 'alarm 120; exec @ARGV' xcrun simctl delete "$id"
          fi
          rm -rf "$RUNNER_TEMP/media-build" "$RUNNER_TEMP/media-package" "$RUNNER_TEMP/media-source-packages" "$RUNNER_TEMP/media-example-source-packages" "$RUNNER_TEMP/media-journey-protocol"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: media-feasibility
          path: |
            ${{ runner.temp }}/media-journey-protocol.log
            ${{ runner.temp }}/media-result-*.json
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/media-package-*.log
            ${{ runner.temp }}/media-example-resolution.log
