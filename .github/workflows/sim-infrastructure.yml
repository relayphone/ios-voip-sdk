name: Simulator infrastructure controls
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sim-infrastructure-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
  helper-controls:
    needs: changes
    if: needs.changes.outputs.helper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s scripts/sim -p 'test_*.py' -v
      - run: bash -n scripts/sim/sim.sh discovery/run_sdk_m0.sh
      - name: Classify failed helper controls
        if: failure()
        run: python3 scripts/sim/sim.py product helper-controls
