name: Inspector GUI

on:
  pull_request:
    paths: &paths
      - 'Inspector/**'
      - 'Sources/Engine/**'
      - 'Sources/Interposition/**'
      - 'Sources/CKSim*/**'
      - 'Sources/cksim/**'
      - 'tools/build-inspector.ts'
      - 'tools/simulator-app.ts'
      - 'tools/runtime-smoke.ts'
      - 'tools/smoke/**'
      - 'tools/inspector-*.ts'
      - 'tools/inspector-ui/**'
      - 'tools/simulator-test-result*'
      - '.github/workflows/inspector.yml'
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: inspector-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  journey:
    name: Inspector GUI journey
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the runtime and Inspector
        run: |
          trap 'if [[ $? != 0 ]]; then echo "product:build failed" >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
          node tools/build-runtime.ts "$RUNNER_TEMP/inspector-journey/runtime" --archs "$(uname -m)"
          node tools/build-inspector.ts "$RUNNER_TEMP/inspector-journey/inspector"
      - name: Drive the GUI and assert on the target journal
        run: |
          set -o pipefail
          work="$RUNNER_TEMP/inspector-journey"
          mkdir -p "$work/results"
          node tools/inspector-resources.ts "$work/results/resources.log" &
          sampler_pid=$!
          finish() {
            status=$?
            kill "$sampler_pid" || true
            wait "$sampler_pid" || true
            if [[ "$status" == 0 ]]; then
              if ! node tools/inspector-resources.ts "$work/results/resources.log" --summary | tee -a "$GITHUB_STEP_SUMMARY"; then
                echo "infra:resource-sampler failed" >> "$GITHUB_STEP_SUMMARY"
                status=1
              fi
            fi
            exit "$status"
          }
          trap finish EXIT
          node tools/inspector-journey.ts "$work"
      - name: Capture simulator state and CoreSimulator logs
        if: failure()
        run: node tools/inspector-resources.ts "$RUNNER_TEMP/inspector-journey/results/final" --diagnostics
      - name: Delete every created simulator and temporary build
        if: always()
        run: |
          status=0
          for marker in "$RUNNER_TEMP/inspector-journey/simulators/"*; do
            [[ -f "$marker" ]] || continue
            name="${marker##*/}"
            xcrun simctl shutdown "$name" || true
            if xcrun simctl delete "$name"; then
              rm "$marker"
            else
              status=1
            fi
          done
          rm -rf "$RUNNER_TEMP/inspector-journey/ui-build" "$RUNNER_TEMP/inspector-journey/runtime" \
            "$RUNNER_TEMP/inspector-journey/inspector" "$RUNNER_TEMP/inspector-journey/Smoke.app"
          if [[ "$status" != 0 ]]; then echo "infra:cleanup failed" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - name: Keep diagnostic screenshots and XCUITest attachments
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inspector-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inspector-journey/results
          if-no-files-found: ignore
          retention-days: 7
