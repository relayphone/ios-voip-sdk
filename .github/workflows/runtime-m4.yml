name: Runtime event stream and inspector
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: runtime-m4-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  nightly-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.coverage.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/nightly_coverage.py runtime-m4.yml
  changes:
    uses: ./.github/workflows/ci-changes.yml
  runtime-native:
    name: Runtime native and Inspector
    needs: [changes, nightly-coverage]
    if: needs.nightly-coverage.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.runtime == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Host tests of the runtime, its protocol and the Inspector, and the CLI controls
        run: |
          set -euo pipefail
          swift test --scratch-path "$RUNNER_TEMP/runtime-host-tests" --filter 'RuntimeEngineTests|CKSimProtocolTests|InspectorTests'
          python3 discovery/check_cli_controls.py
      - name: Build the standalone runtime and the Inspector app
        run: |
          set -euo pipefail
          CKSIM_BUILD_ARCHS="$(uname -m)" bash scripts/build-runtime.sh "$RUNNER_TEMP/runtime"
          bash scripts/build-inspector.sh "$RUNNER_TEMP/inspector"
      - name: Create a simulator for the runtime tests
        id: simulator
        run: |
          set -euo pipefail
          udid=$(scripts/ci/bounded 60 xcrun simctl create "runtime-tests-$GITHUB_RUN_ID" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run the runtime and Inspector tests on the simulator
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-tests-logs"
          xcodebuild test -scheme VoIPSDK-Package -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/runtime-tests" -resultBundlePath "$RUNNER_TEMP/runtime-tests-logs/runtime.xcresult" \
            -only-testing:RuntimeTests CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/runtime-tests-logs/xcodebuild.log"
      - name: Delete the runtime tests' simulator
        if: always() && steps.simulator.outputs.udid != ''
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          scripts/ci/bounded 60 xcrun simctl shutdown "$SIMULATOR_ID" || true
          scripts/ci/bounded 60 xcrun simctl delete "$SIMULATOR_ID"
      - uses: ./.github/actions/upload-transfer
        timeout-minutes: 8
        if: failure()
        with:
          name: runtime-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-tests-logs
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
      - name: Remove this job's build outputs
        if: always()
        run: scripts/ci/bounded 60 rm -rf "$RUNNER_TEMP/runtime-host-tests" "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/inspector" "$RUNNER_TEMP/runtime-tests" "$RUNNER_TEMP/runtime-tests-logs"

  runtime-events:
    if: always() && (github.event_name != 'schedule' || needs.nightly-coverage.outputs.skip != 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [changes, nightly-coverage, runtime-native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the selected Runtime and Inspector check
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EXPECTED_JSON: ${{ needs.changes.outputs.runtime_plan }}
        run: scripts/ci/bounded 30 python3 scripts/ci/changes.py gate
