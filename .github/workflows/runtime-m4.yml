name: Runtime event stream and inspector
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: runtime-m4-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  nightly-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.coverage.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/nightly_coverage.py runtime-m4.yml
  changes:
    uses: ./.github/workflows/ci-changes.yml
  runtime-native:
    name: Runtime native and Inspector
    needs: [changes, nightly-coverage]
    if: needs.nightly-coverage.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.runtime == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      CKSIM_TEST_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
      CKSIM_FIXTURE_INSTALL_TIMEOUT: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode
        id: select
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          mkdir -p "$RUNNER_TEMP/m4-build"
          xcodebuild -version | tee "$RUNNER_TEMP/m4-build/xcode.txt"
          python3 -c "import subprocess; subprocess.run(['xcrun', 'simctl', 'list', 'runtimes', '-j'], check=True, timeout=60)" > "$RUNNER_TEMP/m4-build/runtimes.json"
          uname -m
          sysctl -n hw.memsize
      - name: Watcher and existing CLI controls
        id: controls
        run: |
          swift test --scratch-path "$RUNNER_TEMP/runtime-host-tests" --filter 'RuntimeJournalTests|RuntimeSessionTests|ControlRequestTests'
          python3 Tests/RuntimeEvents/test_watch.py
          python3 Tests/RuntimeEvents/test_native_runner.py
          python3 Tests/RuntimeEvents/test_ci_simulator.py
          python3 Tests/RuntimeEvents/test_filtered_policy.py
          python3 Tests/RuntimeEvents/test_filtered_acceptance.py
          python3 Tests/RuntimeEvents/test_lck_acceptance.py
          python3 Tests/RuntimeEvents/run_lck_multi_policy.py
          python3 Tests/Inspector/test_bridge.py
          python3 Tests/Inspector/test_filter_cases.py
          python3 -m unittest discover -s scripts/sim -p 'test_inspector_*.py'
          python3 Tests/Inspector/test_timing_references.py
          python3 Tests/Inspector/test_timing_receipts.py
          python3 Tests/Inspector/test_incoming_filter.py
          python3 Tests/Inspector/test_filter_model.py
          python3 Tests/Inspector/test_lck_projection.py
          python3 Tests/Inspector/test_lck_controls.py
          python3 Tests/Inspector/test_lck_model.py
          python3 discovery/check_cli_controls.py
          python3 discovery/check_lck_provider_policy.py
      - name: Build simulator runtime and event fixture
        id: build
        run: |
          set -o pipefail
          CKSIM_BUILD_ARCHS="$(uname -m)" bash scripts/build-runtime.sh "$RUNNER_TEMP/runtime" 2>&1 | tee "$RUNNER_TEMP/m4-build/runtime.log"
          bash Tests/RuntimeEvents/build.sh "$RUNNER_TEMP/fixture" 2>&1 | tee "$RUNNER_TEMP/m4-build/fixture.log"
          bash Tests/RuntimeEvents/build-lck.sh "$RUNNER_TEMP/lck-fixture" 2>&1 | tee "$RUNNER_TEMP/m4-build/lck-fixture.log"
          bash scripts/build-inspector.sh "$RUNNER_TEMP/inspector" 2>&1 | tee "$RUNNER_TEMP/m4-build/inspector.log"
      - name: Create the single owned simulator
        id: create
        run: |
          runtime_original_summary="$GITHUB_STEP_SUMMARY"
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/runtime-phase-create.md"
          trap 'if [ -f "$GITHUB_STEP_SUMMARY" ]; then cat "$GITHUB_STEP_SUMMARY" >> "$runtime_original_summary" || :; fi' EXIT
          python3 Tests/RuntimeEvents/ci_simulator.py create --runtime "$CKSIM_TEST_RUNTIME" \
            --id-file "$RUNNER_TEMP/m4-simulator-id" --env-file "$GITHUB_ENV"
      - name: Consume the shared channel through watch
        id: watch
        run: |
          runtime_original_summary="$GITHUB_STEP_SUMMARY"
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/runtime-phase-watch.md"
          trap 'if [ -f "$GITHUB_STEP_SUMMARY" ]; then cat "$GITHUB_STEP_SUMMARY" >> "$runtime_original_summary" || :; fi' EXIT
          set -o pipefail
          python3 Tests/RuntimeEvents/run.py --package "$RUNNER_TEMP/runtime" \
            --app "$RUNNER_TEMP/fixture/RuntimeEventFixture.app" --out "$RUNNER_TEMP/m4-events" \
            --runtime "$CKSIM_TEST_RUNTIME" --simulator "$CKSIM_TEST_SIMULATOR" \
            2>&1 | tee "$RUNNER_TEMP/m4-build/runtime-acceptance.log"
      - name: Verify genuine LCK report and explicit code-4 fault
        id: lck
        run: |
          runtime_original_summary="$GITHUB_STEP_SUMMARY"
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/runtime-phase-lck.md"
          trap 'if [ -f "$GITHUB_STEP_SUMMARY" ]; then cat "$GITHUB_STEP_SUMMARY" >> "$runtime_original_summary" || :; fi' EXIT
          python3 Tests/RuntimeEvents/lck_acceptance.py --app "$RUNNER_TEMP/lck-fixture/LCKRuntimeFixture.app" \
            --out "$RUNNER_TEMP/m4-lck" --all --simulator "$CKSIM_TEST_SIMULATOR"
      - name: Follow an incoming call through the live SwiftUI inspector
        id: inspector
        run: |
          runtime_original_summary="$GITHUB_STEP_SUMMARY"
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/runtime-phase-inspector.md"
          trap 'if [ -f "$GITHUB_STEP_SUMMARY" ]; then cat "$GITHUB_STEP_SUMMARY" >> "$runtime_original_summary" || :; fi' EXIT
          python3 Tests/Inspector/run.py --package "$RUNNER_TEMP/runtime" \
            --fixture "$RUNNER_TEMP/fixture/RuntimeEventFixture.app" \
            --inspector "$RUNNER_TEMP/inspector/CKSimInspector.app" --out "$RUNNER_TEMP/m4-inspector" \
            --runtime "$CKSIM_TEST_RUNTIME" --driver journal \
            --target-simulator "$CKSIM_TEST_SIMULATOR" --fixture-installed --verify-filter-controls
      - name: Delete the owned simulator
        id: cleanup
        if: always()
        run: |
          runtime_original_summary="$GITHUB_STEP_SUMMARY"
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/runtime-phase-cleanup.md"
          trap 'if [ -f "$GITHUB_STEP_SUMMARY" ]; then cat "$GITHUB_STEP_SUMMARY" >> "$runtime_original_summary" || :; fi' EXIT
          python3 Tests/RuntimeEvents/ci_simulator.py cleanup --id-file "$RUNNER_TEMP/m4-simulator-id"
      - name: Summarize Runtime failures
        if: always()
        env:
          RUNTIME_PHASE_OUTCOMES: >-
            {"select":"${{ steps.select.outcome }}","controls":"${{ steps.controls.outcome }}","build":"${{ steps.build.outcome }}","create":"${{ steps.create.outcome }}","watch":"${{ steps.watch.outcome }}","lck":"${{ steps.lck.outcome }}","inspector":"${{ steps.inspector.outcome }}","cleanup":"${{ steps.cleanup.outcome }}"}
        run: python3 scripts/ci/runtime_failure_summary.py || true
      - name: Upload Runtime failure summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-failure-summary
          path: ${{ runner.temp }}/runtime-failure-summary.md
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m4-event-channel
          path: |
            ${{ runner.temp }}/m4-build
            ${{ runner.temp }}/m4-events
            ${{ runner.temp }}/m4-inspector
            ${{ runner.temp }}/m4-lck
            ${{ runner.temp }}/m4-simulator-id
            ${{ runner.temp }}/m4-simulator-id.state.json
            ${{ runner.temp }}/cleanup.log
            ${{ runner.temp }}/cleanup.json
            !${{ runner.temp }}/m4-inspector/ui-build
          if-no-files-found: warn
          retention-days: 7
      - name: Remove generated builds
        if: always()
        run: rm -rf "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/fixture" "$RUNNER_TEMP/lck-fixture" "$RUNNER_TEMP/inspector" "$RUNNER_TEMP/m4-inspector/ui-build"

  runtime-events:
    if: always() && (github.event_name != 'schedule' || needs.nightly-coverage.outputs.skip != 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [changes, nightly-coverage, runtime-native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the selected Runtime and Inspector check
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EXPECTED_JSON: ${{ needs.changes.outputs.runtime_plan }}
        run: scripts/ci/bounded 30 python3 scripts/ci/changes.py gate
