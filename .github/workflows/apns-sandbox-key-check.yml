name: APNs sandbox credential check

# No pushes are sent. The protected environment requires operator approval.
# Keep APNs credentials entirely outside pull_request workflows.
on:
  push:
    branches: [main]
    paths:
      - discovery/send-apns.mjs
      - .github/workflows/apns-sandbox-key-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-key:
    if: github.repository == 'ziahamza/callkit-simulator'
    runs-on: macos-26
    timeout-minutes: 5
    environment: apns-sandbox-device-qa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify private-key retrieval and local ES256 signing
        env:
          PHONE_APNS_KEY_P8: ${{ secrets.PHONE_APNS_KEY_P8 }}
          PHONE_APNS_KEY_ID: ${{ vars.PHONE_APNS_KEY_ID }}
          PHONE_APNS_TEAM_ID: ${{ vars.PHONE_APNS_TEAM_ID }}
          PHONE_APNS_ENVIRONMENT: sandbox
        run: node discovery/send-apns.mjs --check-key
