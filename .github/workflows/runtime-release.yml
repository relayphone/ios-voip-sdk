name: Runtime release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "VERSION"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/**"
      - "tools/**"
      - ".github/workflows/runtime-release.yml"
      - ".github/actions/setup/**"
permissions:
  contents: read
concurrency:
  group: runtime-release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  release-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          xcode: "false"
      - name: Test the release, packaging and smoke test tools
        working-directory: tools
        run: node --test release.test.ts runtime-package.test.ts simulator-app.test.ts
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: release-controls
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Require an annotated version tag merged into main
        run: node tools/release.ts check "$RELEASE_TAG"
      - name: Build the runtime package for both simulator architectures
        run: node tools/build-runtime.ts "$RUNNER_TEMP/runtime"
      - name: Run the host tests
        run: swift test --scratch-path "$RUNNER_TEMP/host-tests"
      - name: Create a simulator for the runtime tests
        id: simulator
        run: >-
          echo "udid=$(xcrun simctl create "runtime-release-$GITHUB_RUN_ID"
          com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-0)"
          >> "$GITHUB_OUTPUT"
      - name: Run the runtime tests on the simulator
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: >-
          xcodebuild test -scheme VoIPSDK-Package
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/runtime-tests" -only-testing:RuntimeTests
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
      - name: Answer and end a call with the package's own runtime and cksim
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: node tools/runtime-smoke.ts "$RUNNER_TEMP/runtime" --simulator "$SIMULATOR_ID"
      - name: Delete the simulator
        if: always() && steps.simulator.outputs.udid != ''
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl shutdown "$SIMULATOR_ID" || true; xcrun simctl delete "$SIMULATOR_ID"
      - name: Package the tested runtime
        run: |
          node tools/package-runtime.ts "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/release"
          node tools/release.ts record "$RELEASE_TAG" --package "$RUNNER_TEMP/runtime" \
            --release "$RUNNER_TEMP/release" --notes "$RUNNER_TEMP/release-notes.md"
          (cd "$RUNNER_TEMP/release" && shasum -a 256 -c SHA256SUMS)
      - name: Attest the archive, checksums and qualification
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*
          create-storage-record: false
      - name: Verify the attested archive before publication
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/release/attestation.sigstore.json"
          gh attestation verify "$RUNNER_TEMP/release/callkit-simulator-$RELEASE_TAG-macos.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/runtime-release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners --bundle "$BUNDLE_PATH"
      - name: Publish the release as a prerelease
        run: >-
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release/"* --verify-tag --prerelease
          --title "iOS VoIP SDK $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Keep the package and release
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-release-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/runtime
            ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 90
