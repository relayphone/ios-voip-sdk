name: Simulator CallKit discovery
on:
  push:
    branches: ["discovery/**", "feat/runtime-engine"]
  pull_request:
    paths:
      - "discovery/**"
      - ".github/workflows/simulator-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: simulator-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Adversarial harness checks
        run: python3 discovery/check_harness.py
      - name: Select the newest installed Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Genuine CallKit versus injected runtime
        run: OUT="$RUNNER_TEMP/out" discovery/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: callkit-discovery-${{ matrix.runner }}
          path: ${{ runner.temp }}/out
