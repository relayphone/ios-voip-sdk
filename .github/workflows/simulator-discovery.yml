name: Simulator CallKit discovery
on:
  push:
    branches: [main, "discovery/**"]
  pull_request:
    paths:
      - "VERSION"
      - "discovery/**"
      - "Sources/**"
      - "Tools/**"
      - "profiles/**"
      - "scripts/**"
      - ".github/workflows/simulator-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: simulator-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        compiler: ["26.6", "26.3"]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Adversarial harness checks
        run: |
          python3 discovery/check_harness.py
          python3 discovery/check_cli_controls.py
          python3 discovery/check_cli_repair.py
          python3 discovery/check_environment.py
          python3 discovery/check_release_controls.py
      - name: Select simulator host and compiler independently
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Concrete CallKit ABI and safe refusal
        env:
          COMPILER_DEVELOPER_DIR: /Applications/Xcode_${{ matrix.compiler }}.app/Contents/Developer
        run: OUT="$RUNNER_TEMP/abi" bash discovery/run_abi.sh
      - name: Deleted-package simulator loader repair
        if: matrix.compiler == '26.6'
        env:
          COMPILER_DEVELOPER_DIR: /Applications/Xcode_${{ matrix.compiler }}.app/Contents/Developer
        run: python3 discovery/run_repair.py --output "$RUNNER_TEMP/repair"
      - name: Genuine CallKit versus injected runtime
        env:
          COMPILER_DEVELOPER_DIR: /Applications/Xcode_${{ matrix.compiler }}.app/Contents/Developer
        run: OUT="$RUNNER_TEMP/out" discovery/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: callkit-discovery-macos-26-xcode-${{ matrix.compiler }}
          path: ${{ runner.temp }}/out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: callkit-abi-macos-26-xcode-${{ matrix.compiler }}
          path: ${{ runner.temp }}/abi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.compiler == '26.6'
        with:
          name: callkit-repair-macos-26-xcode-${{ matrix.compiler }}
          path: ${{ runner.temp }}/repair
