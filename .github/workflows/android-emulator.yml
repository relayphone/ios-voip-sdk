name: Android Emulator

on:
  pull_request:
    paths: ['android/**', 'expo/**', 'spec/**', '.github/workflows/android-emulator.yml']
  push:
    branches: [main]
    paths: ['android/**', 'expo/**', 'spec/**', '.github/workflows/android-emulator.yml']

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-apk:
    name: Build Expo Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build the packed Expo example
        run: |
          timeout --kill-after=10s 240s "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
          npm ci --prefix expo --ignore-scripts --no-audit --no-fund
          npm pack ./expo --pack-destination "$RUNNER_TEMP"
          cp -R expo/example/client "$RUNNER_TEMP/android-example"
          cd "$RUNNER_TEMP/android-example"
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/relayphone-ios-voip-sdk-"*.tgz
          CI=1 node node_modules/expo/bin/cli prebuild --platform android --no-install
          cd android
          NODE_ENV=production timeout --kill-after=15s 600s ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2 --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expo-android-release
          path: ${{ runner.temp }}/android-example/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
  emulator:
    needs: expo-apk
    name: API ${{ matrix.api }} (4g-4cpu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Google APIs x86_64 archives and checksums from Google's SDK repository.
          - api: 34
            archive: x86_64-34_r14.zip
            sha1: e0f6c9a0691aa27bd597d0deb1bcfdc943ac8ca7
          - api: 35
            archive: x86_64-35_r09.zip
            sha1: 0103e6dab21290c4b9d16550a3ce99476f884eef
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - run: node --test emulator/run.test.ts
      - name: Set emulator directories
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          echo "EMULATOR_OUTPUT=$RUNNER_TEMP/android-emulator-output" >> "$GITHUB_ENV"
      - name: Build instrumentation APKs
        if: ${{ hashFiles('android/system/build.gradle.kts') != '' }}
        run: timeout --kill-after=15s 360s ./gradlew :system:assembleDebugAndroidTest --no-daemon --max-workers=2 --console=plain
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: expo-android-release
          path: ${{ runner.temp }}/expo-apk
      - name: Provision KVM and the pinned system image (infrastructure)
        env:
          API: ${{ matrix.api }}
          ARCHIVE: ${{ matrix.archive }}
          IMAGE_SHA1: ${{ matrix.sha1 }}
        run: |
          trap 'echo "::error title=Infrastructure::Unable to provision the Android emulator"' ERR
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME" "$EMULATOR_OUTPUT"
          sdk_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ ! -x "$ANDROID_HOME/emulator/emulator" ]]; then
            timeout --kill-after=15s 180s "$sdk_tools/sdkmanager" --install emulator
          fi
          timeout --kill-after=5s 20s "$ANDROID_HOME/emulator/emulator" -accel-check
          image_root="$ANDROID_HOME/system-images/android-$API/google_apis"
          mkdir -p "$image_root"
          curl --fail --silent --show-error --location --max-time 240 \
            --output "$RUNNER_TEMP/$ARCHIVE" \
            "https://dl.google.com/android/repository/sys-img/google_apis/$ARCHIVE"
          echo "$IMAGE_SHA1  $RUNNER_TEMP/$ARCHIVE" | sha1sum --check
          timeout --kill-after=10s 120s unzip -oq "$RUNNER_TEMP/$ARCHIVE" -d "$image_root"
          unlink "$RUNNER_TEMP/$ARCHIVE"
          timeout --kill-after=5s 45s "$sdk_tools/avdmanager" create avd --name telecom \
            --package "system-images;android-$API;google_apis;x86_64" --device pixel_6 <<< no
          test -f "$ANDROID_AVD_HOME/telecom.avd/config.ini"
      - name: Run Telecom instrumentation and Expo incoming journey
        env:
          EXPO_CALL_JOURNEY_APK: ${{ runner.temp }}/expo-apk/app-release.apk
        run: node emulator/run.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-api-${{ matrix.api }}-failure
          path: |
            ${{ runner.temp }}/android-emulator-output/
            android/system/build/outputs/androidTest-results/
            android/system/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
