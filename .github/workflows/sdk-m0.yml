name: SDK M0 and M1 plain simulator acceptance

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sdk-m0-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Owned CI apps need no injection; local unset values still preserve launchd.
  SIMCTL_CHILD_DYLD_INSERT_LIBRARIES: ""

jobs:
  nightly-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.coverage.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/nightly_coverage.py sdk-m0.yml
  changes:
    uses: ./.github/workflows/ci-changes.yml

  offline-controls:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Simulator helper, CI policy and tool tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/sim -p 'test_*.py'
          python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py'
          (cd tools && node --test)

  apple-host-controls:
    needs: [changes, nightly-coverage]
    if: needs.nightly-coverage.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.sdk == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Check the Swift formatting
        run: swift format lint --strict --recursive --parallel Package.swift Sources Tests Examples Inspector tools/smoke
      - name: Swift tests
        run: swift test --scratch-path "$RUNNER_TEMP/swift-tests"
      - name: Remove this job's build outputs
        if: always()
        run: scripts/ci/bounded 60 rm -rf "$RUNNER_TEMP/swift-tests"

  sdk-example:
    needs: [changes, nightly-coverage]
    if: needs.nightly-coverage.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.sdk == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Build the SwiftUI example for the simulator and for devices
        run: |
          set -euo pipefail
          for build in 'Debug|generic/platform=iOS Simulator' 'Release|generic/platform=iOS'; do
            xcodebuild -project Examples/CallExample/CallExample.xcodeproj -scheme CallExample \
              -configuration "${build%%|*}" -destination "${build#*|}" \
              -derivedDataPath "$RUNNER_TEMP/call-example" CODE_SIGNING_ALLOWED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO build
          done
      - name: Check that the device build leaves out the simulator runtime and CallKit
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/call-example/Build/Products/Release-iphoneos/CallExample.app/CallExample"
          symbols=$(nm "$app")
          libraries=$(otool -L "$app")
          if [[ "$symbols" == *CKSimRuntime* ]]; then
            echo "::error::The Release device build contains the simulator runtime." >&2
            exit 1
          fi
          if [[ "$libraries" == *CallKit.framework* ]]; then
            echo "::error::The Release device build of a LiveCommunicationKit app links CallKit." >&2
            exit 1
          fi
      - name: Remove this job's build outputs
        if: always()
        run: scripts/ci/bounded 60 rm -rf "$RUNNER_TEMP/call-example"

  sdk-core:
    needs: [changes, nightly-coverage]
    if: needs.nightly-coverage.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.sdk == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Evaluate the CocoaPods spec
        run: scripts/ci/bounded 120 pod ipc spec IosVoipSDK.podspec > /dev/null
      - name: Build the call core and its adapters for iOS
        run: |
          set -euo pipefail
          for scheme in VoIPCore VoIPCallKit VoIPLiveCommunicationKit VoIPPushKit VoIPSimulator VoIPTesting; do
            for destination in 'generic/platform=iOS' 'generic/platform=iOS Simulator'; do
              xcodebuild -scheme "$scheme" -configuration Release -destination "$destination" \
                -derivedDataPath "$RUNNER_TEMP/call-core" CODE_SIGNING_ALLOWED=NO \
                COMPILER_INDEX_STORE_ENABLE=NO build
            done
          done
      - name: Remove this job's build outputs
        if: always()
        run: scripts/ci/bounded 60 rm -rf "$RUNNER_TEMP/call-core"

  simulator-journeys:
    name: Call journeys on the simulator
    needs: [changes, nightly-coverage]
    if: needs.nightly-coverage.outputs.skip != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.changes.outputs.sdk == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Create a simulator for the journeys
        id: simulator
        run: |
          set -euo pipefail
          udid=$(scripts/ci/bounded 60 xcrun simctl create "call-journeys-$GITHUB_RUN_ID" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run the call journeys through LiveCommunicationKit, CallKit and PushKit
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/call-journeys-logs"
          xcodebuild test -scheme VoIPSDK-Package -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/call-journeys" -resultBundlePath "$RUNNER_TEMP/call-journeys-logs/journeys.xcresult" \
            -only-testing:VoIPJourneyTests -only-testing:VoIPCallKitTests \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/call-journeys-logs/xcodebuild.log"
      - name: Delete the journeys' simulator
        if: always() && steps.simulator.outputs.udid != ''
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          scripts/ci/bounded 60 xcrun simctl shutdown "$SIMULATOR_ID" || true
          scripts/ci/bounded 60 xcrun simctl delete "$SIMULATOR_ID"
      - uses: ./.github/actions/upload-transfer
        timeout-minutes: 8
        if: failure()
        with:
          name: call-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/call-journeys-logs
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
      - name: Remove this job's build outputs
        if: always()
        run: scripts/ci/bounded 60 rm -rf "$RUNNER_TEMP/call-journeys" "$RUNNER_TEMP/call-journeys-logs"

  plain-simulator:
    name: plain-simulator
    permissions:
      contents: read
      actions: read
    if: always() && (github.event_name != 'schedule' || needs.nightly-coverage.outputs.skip != 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [changes, nightly-coverage, offline-controls, apple-host-controls, sdk-example, sdk-core, simulator-journeys]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every selected acceptance group
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EXPECTED_JSON: ${{ needs.changes.outputs.sdk_plan }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/ci/bounded 30 python3 scripts/ci/changes.py gate; then
            gate_status=0
          else
            gate_status=$?
          fi
          scripts/ci/bounded 10 gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/sdk-attempt.json" 2>/dev/null || true
          if scripts/ci/bounded 10 gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > "$RUNNER_TEMP/sdk-job-timings.json" 2>/dev/null; then
            scripts/ci/bounded 5 python3 scripts/ci/job_timing.py "$RUNNER_TEMP/sdk-attempt.json" < "$RUNNER_TEMP/sdk-job-timings.json" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          else
            echo 'SDK CI timing report unavailable.' >> "$GITHUB_STEP_SUMMARY" || true
          fi
          exit "$gate_status"
