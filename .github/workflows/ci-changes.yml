name: CI change selection
on:
  workflow_call:
    outputs:
      sdk:
        value: ${{ jobs.detect.outputs.sdk }}
      runtime:
        value: ${{ jobs.detect.outputs.runtime }}
      helper:
        value: ${{ jobs.detect.outputs.helper }}
      sdk_plan:
        value: ${{ jobs.detect.outputs.sdk_plan }}
      runtime_plan:
        value: ${{ jobs.detect.outputs.runtime_plan }}
      matrix:
        value: ${{ jobs.detect.outputs.matrix }}
      device:
        value: ${{ jobs.detect.outputs.device }}
      swift:
        value: ${{ jobs.detect.outputs.swift }}
      expo:
        value: ${{ jobs.detect.outputs.expo }}
      legacy:
        value: ${{ jobs.detect.outputs.legacy }}
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sdk: ${{ steps.select.outputs.sdk }}
      runtime: ${{ steps.select.outputs.runtime }}
      helper: ${{ steps.select.outputs.helper }}
      sdk_plan: ${{ steps.select.outputs.sdk_plan }}
      runtime_plan: ${{ steps.select.outputs.runtime_plan }}
      matrix: ${{ steps.select.outputs.matrix }}
      device: ${{ steps.select.outputs.device }}
      swift: ${{ steps.select.outputs.swift }}
      expo: ${{ steps.select.outputs.expo }}
      legacy: ${{ steps.select.outputs.legacy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify selection and aggregate contracts
        run: scripts/ci/bounded 120 python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py'
      - name: Select critical and affected jobs
        id: select
        run: scripts/ci/bounded 60 python3 scripts/ci/changes.py
